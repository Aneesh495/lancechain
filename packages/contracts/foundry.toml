[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
cache_path = "cache"
solc_version = "0.8.27"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "forge-std/=lib/forge-std/src/"
]

[profile.ci]
fuzz = { runs = 1000 }
invariant = { runs = 1024, depth = 128, fail_on_revert = false }

[invariant]
runs = 1024
depth = 128
fail_on_revert = false
